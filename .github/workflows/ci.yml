name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # No dependencies, so there is no install step.
      - name: Validate feed.json (with coverage)
        shell: bash
        run: npm run test:coverage | tee coverage.txt
      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          { echo '## Coverage'; echo '```'; sed -n '/start of coverage report/,/end of coverage report/p' coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

